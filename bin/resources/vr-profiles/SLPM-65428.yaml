# SPDX-License-Identifier: GPL-3.0-or-later
# Outbreak VR profile (our own; not one of PenguinScreen2's CC BY-NC profiles).
#
# Measured on File #1 (J's Bar) with the ARMSX2 stereo testbed, 2026-10-07:
#  - Outbreak's screen Z is exactly affine in 1/w (per-frame fit R2 = 1.000000,
#    100% intercept agreement over 71 draws), so Z-driven depth is safe and
#    gives every draw a correct depth, including untextured ones.
#  - 1/w spans about 0.001 (far walls, w ~ 1000) to 0.018 (nearest props, w ~ 55).
#    Convergence 55 puts the nearest props at the screen plane and everything
#    else behind it.
#  - Separation 0.012 per eye keeps distant content within an IPD-sized offset on
#    a ~2 m wide virtual screen (no eye divergence).
# File #2 runs the same engine; its values are carried over until measured.

SLPM-65428:
  name: "Biohazard Outbreak (Japan, English patch)"
  crcs: [0x32088394, 0x198EFDC1, 0x03C8F393, 0x32097C02, 0x03C90C05]
  tier: stereo
  notes: "Fixed/rail cameras over real-time 3D rooms. First person: camera.lookAt puts the eye at the local character's head."
  # World-locked screen for menus, the item screen, the map, cutscenes and doors: placed straight in front
  # of the head each time first person hands over, 2.5 m out and 1.3 m tall (about 29 deg), so a menu sits
  # in front of you rather than filling your view. arc 0 keeps it flat whatever the VR Screen Curve setting
  # says, so the menu pointer can aim at it. While first person drives the camera, the firstPerson
  # screen is used instead: sized to the game camera's FOV (camera.fov below, 100 deg vertical: height =
  # 2 * distance * tan(50 deg)), flat so perspective holds, and placed where the shown frame was rendered
  # from (camera.lookAt viewMatrix; poseLagMs is the fallback guess), so the runtime can reproject it as
  # the head turns instead of the old frame being glued to the face. Because this height matches camera.fov,
  # VR FirstPersonFov = Auto (the default) may widen the FOV to the headset's view on each arm (100 is the
  # floor, 130 the cap) and the screen then follows the FOV each frame was rendered with; the height here is
  # the Profile setting's, and the sign the FOV is vertical degrees. menu: with the VR Menu Tablet setting
  # on (off by default), a menu opened in first person goes on a small tablet instead, 0.70 m ahead of the
  # eyes, 0.30 m below them and 0.36 m tall, tilted back to face them (tilt: <deg> would fix the angle).
  screen: { distance: 2.5, height: 1.3, arc: 0, menu: { distance: 0.70, height: 0.36, drop: 0.30 }, firstPerson: { distance: 1.5, height: 3.575, arc: 0, poseLagMs: 40 } }
  # Headset only: a gamma lift so the dark rooms (J's Bar) read on a headset's LCD without washing out the
  # blacks. Applied only while first person drives the camera (firstPersonOnly defaults to true), so menus
  # and the item screen keep their own levels; 1.0 is neutral. A starting point to tune in the headset.
  presentation: { gamma: 1.2 }
  # Controller haptics (VR only). Memory reads only, nothing is written, so they work the same online.
  # The game's own DualShock rumble goes to the controllers (the VR "Forward Game Rumble" setting). While
  # first person is armed: losing HP (u16 at local record +0x544; max HP at +0x546, not yet checked live)
  # pulses both hands, harder the bigger the hit, and below a quarter of max HP (a placeholder until the
  # game's own Danger line is measured) the left hand feels a heartbeat. Hurt and heartbeat keep going
  # while grabbed, down or dead. Weapon: the u8 at local record +0xC7C is the equipped item's record
  # index (0 = bare hands) in the 60-byte item table at 0x3967D0 (checked in savestates: +0x00 present,
  # +0x02 own index, +0x06 item id, u16 +0x24 rounds in the gun, +0x28 owner slot + 1). With the stance
  # raised (+0x08 == 2) a drop of the rounds kicks the aim hand and kicks the pistol back; a rise ticks
  # both hands (reload; the action byte +0x54F reads 0x1C then, expected, not yet checked live); an empty
  # gun clicks on a trigger pull. Nothing equipped shows bare hands (no pistol, no laser). The wrist card
  # shows the weapon's name and rounds ("45 AUTO 7"), and the belt pouches name their items from the same table.
  # reloadButton: the game reloads with L1 held while the weapon is lowered (one round per 0.33 s); the reload gesture
  # (VR ReloadGesture setting: take a magazine at the left hip, bring it to the gun, let go) holds it for you.
  # hold (VR GameWeaponModels): how the game attaches a weapon's model to the hand. The u16 at local record +0xCA8 is the
  # equipped weapon's type (written from the item's entry in the scenario's 24-byte item table at 0x716980: u16 item id
  # +0x12, u8 type +0x0F; read by 0x5C1240 -> 0x584800), an index into the 0x44-byte weapon-type table at 0x6E5944 (GAME
  # overlay data; an entry's byte +2 is its own index): +0x0C three f32, the model's origin in the right hand bone's frame;
  # +0x24 three s16, its turn into that frame (X, Y, Z, 0x10000 = 360 degrees, X first); +0x34 three f32, a gun's muzzle
  # in the model. Checked 2026-10-14 in twelve savestates and live with the weapon raised: the held object's matrix is
  # that turn and offset on the hand bone (node 19/28) to 0.01 cm. tools/outbreak-vr/research/2026-10-14-weapon-models-in-hand.md.
  feedback: { padRumble: true, hurt: { offset: 0x544, max: 0x546, width: 2 }, danger: { below: 0.20 }, weapon: { equipped: 0xC7C, table: 0x3967D0, action: 0x54F, reload: 0x1C, reloadButton: L1, hold: { type: 0xCA8, table: 0x6E5944, stride: 0x44, types: 0x80, grip: 0x0C, rotation: 0x24, muzzle: 0x34, items: 0x716980, itemStride: 0x18, itemId: 0x12, itemType: 0x0F, itemCount: 0x80 } } }
  # Pickup cue (VR only, first person; VR setting PickupCue, on by default): when something on the floor comes within reach
  # of the character's own Circle press, the right hand gets a light tick and a short toast names the item and the button
  # ("Kevin's 45 Auto  (A)"), once per approach (not again while it stays in reach; re-armed after half a second out of it).
  # The game has no "can pick up" flag: it searches only when Circle is pressed, so this is a read-only copy of that search
  # (nothing is written), validated live 25 of 25 against the game's own press (2026-10-12, J's Bar pistol, knife and the
  # bathroom Green Herb; tools/outbreak-vr/research/2026-10-12-ui-flags-research.md, section B). The game keeps its trigger
  # nodes in a linked list: u32 0x23BD90 holds the first node's address (gp - 0x5EE0) and each node's +0x28 the next (0 ends).
  # A node counts as a floor item when its type byte +0x30 is 0x80, its search mode +0x31 is 0, its enabled byte +0x3C is
  # non-zero and its busy byte +0x3D is 0, the search circle overlaps its quad (four s32 x, z corners from +0x00; the circle's
  # centre inside it, or within the radius of an edge) and the character's height y lies between the node's s32 y min +0x20
  # and y max +0x24, or the node's y min is up to 200 over it (an item on a counter). The circle is 50 round and centred 46 +
  # the record's own reach f32 (+0x1B4, 0.0 for Kevin) ahead of the character along its heading (s16 +0x92, 0x10000 = 360
  # degrees, 0 faces +z, direction (sin, cos)); position is f32 x, y, z at +0x38. Among the nodes that count the lowest
  # priority byte +0x32 wins. Its u32 +0x40 is a record index in the 60-byte item table at 0x3967D0, whose u16 +0x06 is the item
  # id ItemData names; an id ItemData does not know cues nothing. The walk stops at maxNodes (0x100) and at the first node it
  # meets twice, and every address is range-checked. Nothing is cued while a game screen is up (Circle answers its prompt)
  # or the weapon is raised (Circle fires). File #2's list head is not known yet, so SLPM-65692 has no reach block.
  reach:
    list: 0x23BD90
    node: { next: 0x28, quad: 0x00, yMin: 0x20, yMax: 0x24, type: 0x30, mode: 0x31, priority: 0x32, enabled: 0x3C, busy: 0x3D, item: 0x40 }
    accept: { type: 0x80, mode: 0x00 }
    items: { table: 0x3967D0, stride: 0x3C, id: 0x06 }
    probe: { position: 0x38, heading: 0x92, reach: 0x1B4, ahead: 46, radius: 50, above: 200 }
    maxNodes: 0x100
    # hand: the hand-targeting prototype ([VR] HandTargeting, off by default, offline File #1, read-only). The one trigger it
    # targets, the Handgun on J's Bar counter at the start of the first scenario: item 0, its volume a 40 cm square turned
    # about 25 deg, corners (8503, 12896), (8467, 12913), (8484, 12949), (8520, 12932), y 120-160 (RAM dump, 2026-10-12).
    # A Handgun trigger whose centre is more than tolerance from centre is ignored. range / keep: a target appears with the
    # hand this near the volume's centre and stays until keep; near: the marker brightens this near the volume. Decimal cm.
    hand: { item: 0, centre: [8493.5, 140, 12922.5], tolerance: 10, range: 300, keep: 320, near: 30 }
    # pickup: real hand pickups ([VR] HandPickup, off by default; File #1 strictly offline; research/2026-10-21-hand-pickup.md).
    # Any floor item (the same list walk and filters as the cue) whose volume a hand is inside, or within near cm of, is
    # highlighted (the box shows dim for the nearest within show cm). A deliberate grip squeeze there arms block (magic,
    # the counter's stamp, the local record, the point) and presses Circle once; the cave at site / cave (camera.silence
    # above) makes that press search at the hand. The take-it prompt is told apart by overlay (u32 1), which (u8 1) and sub
    # (u8 2), and its item by the prompt's own item struct (prompt: +1 u8 the item record index, +2 u16 the item id, +8 the
    # name; 2026-10-21 RAM reads, Handgun and Green Herb) and the local record's search result (+0xC7A, the record index);
    # it is confirmed (Circle) only with the grip still held and the prompt's cursor (grid u8 1, cursorNode / cursorIndex)
    # on a free cell of your own (cells: +0xC84, 0 = empty; cellNodes: cells 0-3, a 2 x 2 grid). No free cell: the game's
    # swap is the player's, nothing is pressed. maxReach: a hand farther than this from the character's body (on the floor
    # plane, game cm) highlights nothing, so a pickup stays one to one with the arm.
    pickup: { near: 6, show: 45, maxReach: 85, block: 0xFF200, magic: 0x48504B31, counter: 0x48BF93, site: 0x61DB94, siteOn: 0x0C03FB00,
              cave: 0xFEC00, caveFirst: 0x3C0B0010, prompt: 0x722890, result: 0xC7A, cells: 0xC84, cellCount: 4,
              overlay: 0x720AA0, which: 0x720BE4, sub: 0x720BE2, grid: 0x723F94, cursorNode: 0x720B84, cursorIndex: 0x720B8C,
              cellNodes: [0x720C10, 0x720CA8, 0x720D40, 0x720DD8] }
  # Wrist card (VR only, first person): turn the left wrist to the face to read the character's condition
  # (FINE / CAUTION below 60% of max HP / DANGER below 20% / BLEED), an HP bar and the virus gauge. Reads
  # only. Local record offsets: HP u16 +0x544 of max +0x546; virus counter u32 +0xBAC over the u32 maximum
  # for the u8 character id at +0xB98 in the table at 0x6E6C70 (GAME overlay data, read only while first
  # person is armed); bleeding while u16 +0xC5A is non-zero.
  hud: { wrist: { hp: { offset: 0x544, max: 0x546, width: 2 }, virus: { offset: 0xBAC, maxTable: 0x6E6C70, charOffset: 0xB98 }, bleed: { offset: 0xC5A, width: 2 } } }
  # Menu pointer (VR settings Menu Pointer, on by default, and Menu Tablet, off): in a menu opened from first person
  # the controller casts a beam and a dot onto the menu screen and both hands point. On the item screen, pointing at
  # one of your four item cells or the equipped box steers the game's own cursor there with D-pad presses from your
  # own pad, closed loop (the cursor struct below is read after every press), with a light tick as it lands; pull
  # the trigger (Circle) to select as usual. Nothing is ever confirmed for you: only the D-pad is pressed, and a
  # trigger pulled before the cursor has arrived reaches the game once it has, or never.
  # Research (offline PINE reads, File #1 J's Bar, Kevin): u32 0x720B80 is 1 while the item screen is up (and stays 1
  # after it closes, so it is no proof on its own; see liveWhen); u32
  # 0x720B84 points at the cursor's cell node (nodes 0x98 apart); u16 0x720B8C is the cell's index in its panel and
  # u16 0x720B8E / 0x720B90 its x / y, screen units written in DECIMAL (x 498 is 498, not 0x498). Partner panels
  # reuse the same x / y with other nodes, so a cell is node, index, x and y together; any other node (a partner's
  # panel, another tab, a submenu) is left alone, and a node matching with the rest different stops steering for
  # that opening. rect: where each cell shows, as fractions of the game picture (u0, v0, u1, v1), measured from
  # captures of cells 1, 2 and the equipped box. up/down/left/right: the cell one press leads to (cell 3 Right goes
  # to a partner's panel, so it is left out and never pressed); cell 2 Right and cell 3 Left and Up are expected,
  # not yet measured.
  # suspendWhen: u8 0x720BA0 (the cursor struct + 0x20) is 1 while an item's command submenu (EQUIP/USE/PLACE/...)
  # is open (offline full-RAM diffs, 2026-10-11; moving inside the submenu leaves the cursor's node alone). While it
  # is, nothing is pressed, so the submenu's highlight never moves under you and PLACE can't be reached by accident;
  # the trigger is yours (a fresh pull confirms the submenu entry; one held back before it opened stays back until you
  # let go). Once it closes, steering waits until the dot moves to another cell, and after any confirm it also waits
  # 0.4 s, so a submenu that confirm opens has its flag up before another press could go out. Timing: a press held 2
  # vsyncs and released at least 2 (the game polls at 30 fps), at most 6 presses per move, 10 vsyncs for the cursor to
  # answer; a cell counts after 60 ms (entered 12% inside its edges), nothing in the first 300 ms after the screen opens.
  # coop: true steers in private co-op too (first person, and with it menu mode, never runs on obsrv): it presses
  # only your own pad's D-pad and reads only your own item screen's cursor. If the first co-op session's log says
  # the cursor struct did not match, set coop: false.
  # liveWhen: the when list alone also passes on the map and pause after any visit to the item screen (0x48BF7E is up
  # for all three and the cursor struct's 0x720B80 stays 1 once the item screen closes), and the stale cursor still
  # matches a cell, so pointing would press the D-pad on the map or pause. u8 0x723F94 is 1 while the cursor is in your
  # own item grid and 0 once the screen closes (offline reads, 2026-10-11), and the item screen always opens on cell 0,
  # in the grid; it reads 0 in the equipped box, so it is not checked every poll: the item screen counts as up once it
  # has read 1 since the when list last started passing, and stops the moment the when list fails (the screen closes).
  # Expected to read 0 on the map and pause; menutest.py map-after-items checks it. Belt and braces: two presses in one
  # opening that the cursor does not answer turn point-to-select off until the screen opens again.
  menuPointer:
    when:
      - { address: 0x540004, equals: 3 }             # GAME overlay resident
      - { address: 0x720AA0, equals: 1 }             # a game screen drawn: the item screen, the map, pause or a
                                                     # take-it prompt. In a take-it prompt the cursor struct tracks the
                                                     # highlight exactly (the 4 cells, same nodes, index and x/y; the box
                                                     # cannot be reached), 0x723F94 reads 1 and 0x720BA0 0, so you point
                                                     # at the cell the item goes into; the trigger on a full cell SWAPS
                                                     # (the old item drops to the floor), so it confirms only where the dot
                                                     # rested, as everywhere. The map and pause fail liveWhen.
      - { address: 0x720B80, equals: 1 }             # the item screen has been up (stays 1 after it closes)
    liveWhen:
      - { address: 0x723F94, equals: 1, width: 1 }   # the cursor in your own item grid (where the screen opens)
    suspendWhen:
      - { address: 0x720BA0, equals: 1, width: 1 }   # an item's command submenu is open
    cursor: { node: 0x720B84, index: 0x720B8C, x: 0x720B8E, y: 0x720B90 }
    hand: right        # the left controller (the Steam Frame's D-pad hand) never takes the pointer
    coop: true
    pressVsyncs: 2
    gapVsyncs: 2
    settleVsyncs: 10
    maxPresses: 6
    dwellMs: 150       # real hands drift across a cell's edge: the dot must hold a cell this long
    armDelayMs: 300
    enterInset: 0.12
    cells:
      - { node: 0x720C10, index: 0, x: 498, y: 108, rect: [0.807, 0.184, 0.895, 0.307], right: 1, down: 2 }          # cell 0
      - { node: 0x720CA8, index: 1, x: 550, y: 108, rect: [0.895, 0.184, 0.982, 0.307], left: 0, down: 3 }           # cell 1
      - { node: 0x720D40, index: 2, x: 498, y: 160, rect: [0.807, 0.307, 0.895, 0.430], up: 0, right: 3, down: 4 }   # cell 2
      - { node: 0x720DD8, index: 3, x: 550, y: 160, rect: [0.895, 0.307, 0.982, 0.430], up: 1, left: 2, down: 4 }    # cell 3
      - { node: 0x722928, index: 0, x: 550, y: 216, rect: [0.888, 0.456, 0.979, 0.581], up: 2 }                      # equipped box
  # Belt pouches ([VR] BeltPouches, off by default since 2026-10-14), Dungeons of Eternity style: five pouches on your body, the four on your chest
  # laid out like the item screen's 2 x 2 grid and the equipped box at your belt buckle. Reach a hand into one and it
  # ticks: once and lightly for an empty cell, twice and firmer while the cell holds an item (the local record's item
  # byte +0xC84 + k for cell k, 0 = empty; the equipped box shows the special item, Kevin's .45 whether or not it is
  # equipped, so its pouch reads the special item's byte +0xC88; read only, nothing is written). An open hand reaching
  # into a pouch that holds an item also shows its name for 1.5 s ("Kevin's 45 Auto 7", "45 Auto Magazine x7", "Green
  # Herb"): the byte is a record index into the item table feedback.weapon names, and the record must be present, name
  # itself and be yours (owner = local slot + 1) as for the weapon cues; once per reach (a return within 0.5 s is not
  # named again) and not while a menu is up, where the item screen names it. Squeeze the grip in one: with the item
  # screen closed it opens through the belt zone exactly as a squeeze at your left hip does (you stop, then Start), and
  # the menu pointer steers the cursor to that pouch's cell with the same D-pad presses as pointing (so it follows the
  # Menu Pointer setting); with the screen already up a squeeze just moves the cursor there. Then pull the trigger
  # (Circle) to pick it as usual: nothing is ever confirmed for you, and a squeeze is refused while an item's command
  # submenu is open (suspendWhen: the cursor struct + 0x20, measured offline 2026-10-11). Only while first person is
  # armed, so never on obsrv.
  # Layout, in metres from your eyes the way the zones are placed (side + right, height + up, forward + ahead), measured
  # sitting upright and looking ahead; each pouch is a ball 6.5 cm round its point. A starting point to tune in the
  # headset: high and narrow, the lower ones standing out from the body, to keep clear of the hip zones (balls 20 cm
  # round, plus 3 cm before a hand counts as out):
  #              left                    right
  #   chest      cell 0 (-0.10, -0.20)   cell 1 (0.10, -0.20)   forward 0.14
  #   ribs       cell 2 (-0.07, -0.29)   cell 3 (0.07, -0.29)   forward 0.24
  #   buckle          equipped box (0, -0.40)                   forward 0.28
  # anchor: seat hangs them from your neck and turns them with the forward you last recentered to, so looking down at a
  # pouch, or glancing at it, does not move it (anchor: head would place them as the zones are, turning with your head).
  # If they feel turned, sit facing forward and recenter (both stick clicks, or the Steam button's recenter).
  # The zones come first: within 23 cm of the holster's point your right hand is the holster's, and within 23 cm of the
  # belt's your left hand is the belt's, even inside a pouch, so a squeeze at your hip does what it always did. Facing
  # ahead every pouch keeps at least 5 cm round its point clear of both, for either hand; the lower pouches' and the
  # buckle's outer edges reach the hip zones (and turning your head swings the zones, not the pouches). An empty pouch
  # ticks with a short sharp tap, not the zones' softer entry tick.
  pouches:
    anchor: seat
    open: belt
    hand: either
    radius: 0.065
    suspendWhen: [{ address: 0x720BA0, equals: 1, width: 1 }]   # an item's command submenu is open
    list:
      - { cell: 0, item: 0xC84, side: -0.10, height: -0.20, forward: 0.14 }   # upper left chest  -> item cell 0
      - { cell: 1, item: 0xC85, side: 0.10, height: -0.20, forward: 0.14 }    # upper right chest -> item cell 1
      - { cell: 2, item: 0xC86, side: -0.07, height: -0.29, forward: 0.24 }   # lower left        -> item cell 2
      - { cell: 3, item: 0xC87, side: 0.07, height: -0.29, forward: 0.24 }    # lower right       -> item cell 3
      - { cell: 4, item: 0xC88, side: 0.0, height: -0.40, forward: 0.28 }     # buckle -> the equipped box (special item)
  stereo:
    separation: 0.012
    convergence: 55.0
    zDrivenDepth: true
    # First-person screen (1.5 m away, 4.77 m wide). auto derives separation = IPD / screen width and
    # convergence = distance x unitsPerMeter from the headset and the first-person screen as placed, so far
    # content lands one IPD apart and the screen plane sits at the screen's distance, eased in over 0.5 s on
    # each arm. The numbers are the fallback until the headset reports its eyes, or with VR
    # FirstPersonAutoStereo off (0.0132 = 0.063 m / 4.77 m, 150 = 1.5 m x 100 units/m). VR
    # FirstPersonStereoStrength scales it. nearest: true depth continues in front of the screen plane down
    # to 0.5 m perceived instead of flattening everything nearer onto it; textured, perspective-Q draws
    # only, so 2D overlays (the game's message text) stay on the screen plane, and a counter nearer than
    # it then shows in front of text drawn over it. 0.5 m since Alex's first headset test (2026-10-12):
    # at 1.0 m the pistol on J's Bar counter felt far away. VR NearDepthMetres overrides it; if the game's
    # own text looks doubled or sunk into a surface, [VR] NearDepthMetres = 1.0 brings back wave 8's near
    # field and -1 turns it off.
    firstPerson: { separation: 0.0132, convergence: 150, nearest: 0.5, auto: true }
    # Menus flat: while any game screen is drawn (u32 0x720AA0 = 1, the flag camera.lookAt.pauseWhen reads; first
    # person stands down then, so this rule applies) the picture goes at zero separation, so the menu lies exactly on
    # the screen's plane, where the menu pointer's dot is drawn. With the base separation the menu's draws took depth
    # from their Z and floated off the plane, away from the dot.
    scenes:
      - { when: { address: 0x720AA0, equals: 1 }, separation: 0, label: menu }
  # First-person camera (only with --vr and the VR 'Head-Tracked Camera' setting, on by default).
  # Outbreak builds its view from an eye and a target vector. During normal room play (GAME overlay
  # resident, scenario in game, room camera in normal mode) the room camera's three cut handlers and the
  # door follow camera's eye writes are NOP'd, so nothing overwrites them; the view build after them still
  # runs. camera.lookAt then writes the eye at the local character's head every vsync, looking along the
  # character's heading (+0x92) plus head yaw, tilted by head pitch, moved by head translation (cm units).
  # File #1 addresses checked against our GAME.BIN; heading +0x92 from the camera/ModernCam research.
  # Research notes: tools/outbreak-vr and D:/Games/PS2/research on the test PC.
  camera:
    networkFlag: 0x3065C2   # u8 1 while the game is in network play. Online, first person arms only in private co-op
                          # (VR setting PrivateCoopFirstPerson + the Internal DNS as DNS1, sending the login host to a LAN or Tailscale server); see CameraDriver::ResolveNetMode.
    # Local character record. count/idOffset: the game runs a human record as the local player only when its +0x03
    # byte equals the local slot byte (0x639A30: lbu v1,0x3(s0); lbu v0,0x48BF7D; bne), so first person writes only
    # a record that passes the same test, and nothing while it fails.
    base: { indexed: 0x476DD0, indexAddr: 0x48BF7D, indexWidth: 1, stride: 0x10E0, count: 4, idOffset: 0x03 }
    guards:
      - { address: 0x540004, equals: 3 }             # GAME overlay resident
      - { address: 0x48BF60, equals: 2, width: 1 }   # scenario status: in game
      - { address: 0x3AEF75, equals: 0, width: 1, alsoEquals: [4, 5], alsoWhenSetting: ScriptedShotsFirstPerson }   # room camera in normal mode (not a scripted shot)
      # The room camera's modes (u8 0x3AEF75, dispatcher FUN_0058E420 from 0x5CDEF0): 0 the room's cuts, 1 a door, 2 an
      # arrival, 3 grabbed, 4 a fixed cut (FUN_0058EB70: cut u8 0x3AEF55 for u16 0x3AEF56 frames, 0xFFFF until script op
      # 0x15 lets go; it also holds the player's input, u8 0x48C019 = 1, every frame it runs), 5 the camera shake
      # (FUN_0058EC30; the task FUN_005A94E0 adds a table's offsets to the eye's and target's y). With [VR]
      # ScriptedShotsFirstPerson (on) modes 4 and 5 pass too: in mode 4 the room camera only picks the cut, through the same
      # three cut handlers the silence entries below skip, so the VR eye stays the camera; the scripts that start them (op
      # 0x13 / 0x16 and 37 game call sites) and the ones that wait on them (op 0x14 / 0x17 test the mode byte, which the game
      # still sets and clears itself) run as before. Modes 1-3 and cutscenes (status 4) still hand over to the world screen.
