# SPDX-License-Identifier: GPL-3.0-or-later
# Outbreak VR profile (our own; not one of PenguinScreen2's CC BY-NC profiles).
#
# Measured on File #1 (J's Bar) with the ARMSX2 stereo testbed, 2026-10-07:
#  - Outbreak's screen Z is exactly affine in 1/w (per-frame fit R2 = 1.000000,
#    100% intercept agreement over 71 draws), so Z-driven depth is safe and
#    gives every draw a correct depth, including untextured ones.
#  - 1/w spans about 0.001 (far walls, w ~ 1000) to 0.018 (nearest props, w ~ 55).
#    Convergence 55 puts the nearest props at the screen plane and everything
#    else behind it.
#  - Separation 0.012 per eye keeps distant content within an IPD-sized offset on
#    a ~2 m wide virtual screen (no eye divergence).
# File #2 runs the same engine; its values are carried over until measured.

SLPM-65428:
  name: "Biohazard Outbreak (Japan, English patch)"
  crcs: [0x32088394, 0x198EFDC1, 0x03C8F393, 0x32097C02, 0x03C90C05]
  tier: stereo
  notes: "Fixed/rail cameras over real-time 3D rooms. Head-driven camera needs a lookAt op (not yet implemented)."
  screen: { distance: 2.0, height: 1.4 }
  stereo:
    separation: 0.012
    convergence: 55.0
    zDrivenDepth: true
  # VR controllers (only when launched with --vr; flat play is untouched).
  # A pad bound in Settings -> Controllers (e.g. a DualSense) keeps working alongside;
  # when both touch the same button, the latest change wins.
  #
  # Layout from the reverse-engineered button map (outbreak-vr docs/game-internals.md,
  # Controller TYPE A, the default). Circle = OK/attack/fire, Cross = cancel/back
  # (hold + forward = run), Square = ad-lib, Triangle = map, Start = item screen,
  # R1 held = weapon ready with lock-on, L1 = reload / next target / tab.
  # Select (pause/options) stays off the controllers on purpose: online it doesn't pause.
  #
  # The right grip is for gestures only, so a squeeze at the hip can't also do something
  # else. Zones are placed from the head (metres: side + right, height + up, forward +
  # ahead) and turn with the head's yaw. Squeeze the grip inside one to press its button;
  # it holds until the grip opens, wherever the hand goes.
  # To tune: copy this file into <data dir>/vrprofiles/ and edit the copy.
  controls:
    - device: Gamepad
      id: controllers
      pad: 1
      bind:
        RightTriggerPress: Circle
        ButtonA: Circle
        ButtonB: Cross
        ButtonX: Triangle
        ButtonY: Square
        Menu: Start
        LeftTriggerPress: L1
        LeftGripPress: L2
        RightStickClick: R3
        LeftStickX: LeftStickX
        LeftStickY: LeftStickY
        RightStickX: RightStickX
        RightStickY: RightStickY
    - device: Zone
      id: holster
      notes: "Right hip holster: squeeze the grip there to ready the weapon (R1, lock-on); keep squeezing to stay aimed."
      placement: { side: 0.22, height: -0.62, forward: 0.0 }
      params: { radius: 0.15, hand: right, grip: true }
      pad: 1
      bind:
        Pressed: R1
    - device: Zone
      id: backpack
      notes: "Over the right shoulder: reach back past your ear and squeeze the grip to open the item screen (Start)."
      placement: { side: 0.15, height: -0.10, forward: -0.15 }
      params: { radius: 0.13, hand: right, grip: true }
      pad: 1
      bind:
        Pressed: Start
