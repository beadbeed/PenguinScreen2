    # The code caves the melee entries above write (nightly review M2, b2, d2). Each goes in all or nothing: its whole
    # range must read zero (or exactly these words) and holds exactly `words` silence entries; the body is written and
    # read back before any site that jumps into it (an entry whose `when` reads a word in the range) is patched. Sites
    # go back at once; a body is zeroed only once the game counter 0x48BF93 has moved 3 frames and the EE is not in it.
    caves:
      - { from: 0xFE000, to: 0xFE1E0, words: 99, counter: 0x48BF93 }    # A (0xFE000), C (0xFE100), B (0xFE170) (PhysicalMelee)
      - { from: 0xFE200, to: 0xFE8F0, words: 380, counter: 0x48BF93 }   # D, E, F, H (PhysicalMeleeContact)
      - { from: 0xFE900, to: 0xFE9D8, words: 54, counter: 0x48BF93 }    # G (MeleeHitJolt; at 0xFE800 before cave H)
      - { from: 0xFEA00, to: 0xFEA7C, words: 31, counter: 0x48BF93 }    # I (GunRayAim)
      - { from: 0xFB000, to: 0xFB0C0, words: 48, counter: 0x48BF93 }    # O (GunObjectAim: the shot's weapon object, the flash stub)
      - { from: 0xFEC00, to: 0xFEC94, words: 37, counter: 0x48BF93 }   # HandPickup (the Circle search at the hand)
      - { from: 0xFC000, to: 0xFC12C, words: 75, counter: 0x48BF93 }    # spatial audio (SpatialAudio)
      - { from: 0xFD000, to: 0xFD374, words: 221, counter: 0x48BF93 }    # V (VrBody)
    lookAt:
      eye: 0x306338
      target: 0x306344
      position: 0x38      # f32 x, y (up), z
      heading: 0x92       # s16, 0x10000 = 360 deg, 0 faces +Z
      eyeHeight: 155
      eyeForward: 10      # about where the eyes are; the body is hidden (camera.silence: the focus character's
                          # draws are skipped), wherever your head goes
      distance: 100
      roll: 0x30638C         # camera roll (s32 holding a 16-bit angle): written level (rollSign 0) so a cut's
      rollSign: 0          # roll can't stay latched; the first-person screen itself stays roll-level
      unitsPerMeter: 100
      # Outbreak's yaw grows counter-clockwise like the headset's (checked: with the camera held at yaw W,
      # stick left walks toward W+90, right toward W-90), so yawSign stays 1.
      # Movement is camera-relative in the default control type: stick up walks where the camera
      # looks, i.e. where you look. So the camera keeps its own yaw (the way the character faces each
      # time first person takes over or you recenter), turned smoothly by the right controller stick
      # (120 deg/s at full push), or in 30 deg steps with the VR "Snap Turning" setting.
      yawAnchor: true
      smoothTurnDegPerSec: 120
      snapTurnDeg: 30
      snapStick: right
      # Any game screen drawn: the item screen (every tab, the command and REQUEST submenus), the map, pause and the
      # "Will you take it?" prompt (a floor pickup or a partner's hand-over). u32 0x720AA0 is written only by
      # FUN_006A5A10: 1 from the shared screen opener FUN_006B95C0, 0 from the shared close path at 0x6AEA10 (which also
      # clears 0x48BF7E); offline 2026-10-12 it read 1 in all 430 samples with a screen open and 0 in all 1255 of
      # normal play (walk, run, aim, shots, ad-libs, doors, the opening cutscene, a grab, "X Obtained", examine text).
      # The take-it prompts raise it alone, which is why they stayed on the big first-person screen when this read
      # 0x48BF7E; on the item screen and the map it rises 0.55-0.65 s after 0x48BF7E, as the screen is drawn. The camera
      # then holds still and the screen goes on the world screen in front of you.
      # (tools/outbreak-vr/research/2026-10-12-ui-flags-research.md)
      # With VR MenuPanel on (off by default) first person keeps the camera instead (camera only, the sticks stay the
      # menu's): every screen still draws the room first, and the GS splits the screen's own draws onto a panel in front
      # of you (tools/outbreak-vr/research/2026-10-13-menu-panel.md).
      pauseWhen: [{ address: 0x720AA0, equals: 1 }]
      # Standing idle (stance 1, action 0) with the stick centred, the character turns to face where you
      # look, so picking things up and examining them works on what you're looking at.
      bodyFollow:
        - { offset: 0x08, equals: 1, width: 1 }     # stance: normal (2 = weapon raised)
        - { offset: 0x54F, equals: 0, width: 1 }    # action: idle (1 walk, 3 run, 128 aiming)
        - { offset: 0xF98, equals: 0, width: 2 }    # stick magnitude: centred
      # Hide your own body, and nothing else (tools/outbreak-vr/research/2026-10-13-near-cull.md). The game hides
      # what comes near its camera: FUN_005902F0 (GAME overlay) says "culled" when a model's feet + 100 up are
      # nearer the eye (0x306338) than its class radius (f32 table 0x6D6CF0: 20, 80, 180, 300). Its only callers
      # are draw passes: characters (0x345210, and a first pass 0x345020), enemies (0x688010, 0x345170), NPCs
      # (0x651720) and what a character holds (0x560B60); each skips the draw, so a zombie at your face vanished.
      # The camera's focus character (u8 0x3AEF74) is never tested. The old way hid your body by pointing the focus
      # at an empty slot so the cull caught you; with the cull off that cannot work, so the silence entries above
      # skip the focus character's draws instead. The game's own hide flags (u8 0x48AEA0-3: the focus, the others,
      # enemies, NPCs) are no use for this: the room camera rewrites them every frame from the current shot's
      # flags (0x58EAAC), so a vsync hold never reaches the draw.
      # The focus is left alone: the room camera's init sets it to the local slot (0x58DED8) and nothing else writes
      # it. The one entry here only repairs a savestate made under the old focus hold (focus 3 while you are slot
      # 0, e.g. File #1 slot 3); it writes once and never gives 3 back. Nothing here picks a value from the local
      # slot byte 0x48BF7D: offline the game sets it to 1 and 2 for a moment every frame while it runs the AI
      # partners (0x588C30), so a vsync can see it mid-change. The camera's near plane is 1 cm (f32 0x30637C,
      # set by 0x345480): it clips nothing.
      # Grabbed by a zombie (stance 5, checked on File #1: bites follow until Kevin breaks free), or down / dead /
      # turned (File #1 status 0xBA0, from the tracker decoder: 0x18-0x1C down, 0x1D-0x7F dead, 0x80 and above
      # zombie; normal play stays below 0x18): the game's own
      # camera shows it on the world screen; first person comes back facing the way the character does.
      releaseWhen:
        - { offset: 0x08, equals: 5, width: 1 }
        - { offset: 0xBA0, min: 0x18, max: 0xFF, width: 1 }
      hold:
        - { address: 0x3AEF74, value: 0, width: 1, when: [{ address: 0x3AEF74, equals: 3, width: 1 }, { address: 0x48BF7D, equals: 0, width: 1 }], notes: "repair: a savestate from the old focus hold (focus 3, you slot 0)" }
      # The view matrix the game builds from eye/target (row vectors). Matching it against what was
      # written says which head pose each displayed frame came from, so the first-person screen is
      # placed exactly there (no judder). The frame on screen is two view updates behind the newest one
      # (measured on SteamVR's null headset with a fake swaying head: world wobble 2-3 px at 2 frames
      # back, 6-11 px at 0, 1 or 3, 10 px with the old 40 ms guess).
      viewMatrix: 0x3062E0
      # The screen matrix the game projects with (projection x viewport, row vectors, built by 0x18F0E0 every frame:
      # X = m[0] x / w + 2048 in GS pixels, fx 161.1 at the first-person FOV), read by [VR] TrueStereo to map each eye's
      # vertices (tools/outbreak-vr/research/2026-10-21-true-stereo.md).
      screenMatrix: 0x2771A0
      syncFramesBack: 2
      # A smooth stick turn is rendered ahead by how late frames reach the screen (measured, at most
      # 120 ms), so its leading edge shows no black band; heading, aim and walking keep the true yaw.
      # The head is led too, by its angular velocity times that latency times this damping (0.8).
      # 0 turns both off.
      predict: 0.8
      # Weapon raised (stance 2, R1 or the hip holster): the character faces where the right
      # controller points, and aims as far up or down as it points (s16 +0xBC8, 0x10000 = 360 deg;
      # positive is up, checked: stick up while aiming drives it toward +8192). Offline only: it needs the
      # servo silenced (the offlineOnly silence entries above); online-safe the game keeps its own pitch.
      # pitchClamp 8000 (about 44 deg) stays under the game's own 8192 clamp so its clamp stores don't fire.
      # Walk and shoot: with the weapon up the left stick moves you at 70 cm/s (where you look, like
      # walking); the game itself would only turn and tilt the aim with it. Checked on File #1: walls
      # still stop you (the game's collision pushes the position back out).
      aim: { stance: 0x08, equals: 2, hand: right, move: 70, moveStick: left, pitch: 0xBC8, pitchSign: 1, pitchClamp: 8000 }
    fov: { address: 0x306380, encoding: f32, scale: 100.0 }   # vertical FOV, degrees (about 115 horizontal at 4:3); the floor of VR FirstPersonFov = Auto
  # Shake to break free (VR controllers only). Measured offline on File #1 (J's Bar, savestate 5, a zombie grabs Kevin):
  # a grab (local record stance +0x08 == 5) lasts about 10 s with no input; mashing Circle or Cross (about 8 Hz) or
  # waggling the left stick left and right (about 6 Hz) halves it; all together break free in about 3.3 s; Square does
  # nothing. So while grabbed, shaking either controller (its grip faster than shakeSpeed m/s, or reversing direction
  # `reversals` times within reversalWindowMs while moving at least reversalSpeed m/s) waggles your left stick (stickHz
  # full left-right cycles a second) and presses Circle and Cross in turn (pressHz presses a second, Circle first, pressMs
  # each), with a short buzz (buzz, buzzMs) on the shaking hand for each press. It goes on holdMs after the last shake
  # (the turn at the end of each stroke) and stops the poll the grab ends. A button you hold yourself is never let go:
  # no Circle presses while you hold A or the trigger, no Cross while you hold B, and your own sideways push on the left
  # stick wins over the waggle. grabbed: checks on the local record, all must hold: stance 5, and the status byte in
  # normal play (below 0x18; down, dead and turned are 0x18 and up, see releaseWhen) so nothing is pressed into a death
  # or a prompt. Never while a menu is up (lookAt.pauseWhen) and never on obsrv (first person's network rule); private
  # co-op is fine, as it is only your own pad input. "Shake to break free!" shows on the first grab of a run.
  breakout:
    grabbed:
      - { offset: 0x08, equals: 5, width: 1 }               # stance: grabbed
      - { offset: 0xBA0, min: 0x00, max: 0x17, width: 1 }   # status: normal play (not down, dead or turned)
    shakeSpeed: 1.0
    reversals: 3
    reversalWindowMs: 300
    reversalSpeed: 0.25
    holdMs: 250
    stickHz: 6
    pressHz: 8
    pressMs: 60
    buzz: 0.35
    buzzMs: 20
    # VR GrabFacePull (off by default): while grabbed in first person (VR GrabFirstPerson), the view eases round toward the
    # nearest enemy within `within` game units across the floor (20 deg/s at most). Reads only: the enemy table (melee's),
    # its present byte and its f32 x, y, z position at +0x38 (offline 2026-10-21, slot 5: the grabbing zombie 32-35 units
    # from Kevin, behind him: bearing 131 deg against his heading 311).
    facePull: { enemies: 0x3FFCA0, stride: 0xD90, count: 0x40, present: 0x00, position: 0x38, within: 120 }
  # Physical melee (VR setting PhysicalMelee, off by default; tools/outbreak-vr/research/2026-10-14-melee.md). With a melee
  # weapon equipped, a deliberate swing of the right controller presses Circle on your own pad (R1 too, first, if the weapon
  # is down: the game swings only from the raised stance, 0.6 s later), and the camera.silence entries above put the game's
  # own hit test on the VR weapon. swing: the local record's sub-action byte (+0x09: 1 aim idle, 3 the melee swing) and the
  # stance with the weapon down (the raised one is feedback.weapon's). enemies: the enemy table (0x3FFCA0, 0xD90 a slot, 64
  # slots; byte +0x00 present, s16 HP +0x544), read only for the contact buzz. override: the host's block for the caves, the
  # magic and the game's frame counter it stamps. tip: the point whose speed is measured, metres up the controller's handle;
  # speed / rest: m/s there to start and end a stroke; travel: metres of stroke before it counts; straightness: the stroke's
  # straight-line distance over its path (a waggle never counts). pressMs: how long Circle is held; raiseMs: how long R1 may
  # take to bring the weapon up; contactMs: an HP drop this long after the swing still buzzes; cooldownMs: the gap before
  # the next swing. Never while a game screen is up, grabbed or hurt. Offline in full; online only with the separate
  # [VR] PhysicalMeleeOnline in private co-op (tools/outbreak-vr/research/2026-10-14-melee-coop.md): the swing presses the
  # game's own attack there too (partners see the game's own swing), and the hit follows the VR weapon only while this
  # console runs the room's enemies. online: how that is read (only reads): room, the u16 room the local player is in;
  # masters, NETAQ.BIN's table of each room's players (4 bytes a room, the first the console that runs its enemies, read by
  # FUN_0060EF30 through 0x1AF440); overlay / overlayTag, a word of NETAQ.BIN's header that must read so (its name,
  # "neta"), else no console is taken as ours; free, the start of the free RAM the caves use (up to the block's end), which
  # must read zero before the caves go in online.
  melee:
    attackButton: Circle
    # u8 0x48BF7E: up as soon as a screen opens (item screen, map, pause), before pauseWhen's 0x720AA0. No press starts
    # while it or a game screen is up, or until both have been clear 0.2 s; a press in flight lets go when either rises.
    screenFlag: 0x48BF7E
    swing: { sub: 0x09, idle: 1, attack: 3, normalStance: 1 }
    enemies: { table: 0x3FFCA0, stride: 0xD90, count: 64, present: 0x00, hp: 0x544 }
    override: { block: 0xFF000, magic: 0x4D454C31, counter: 0x48BF93 }
    online: { room: 0x3065AC, masters: 0x825810, overlay: 0x820020, overlayTag: 0x6174656E, free: 0xFE000 }
    tip: 0.40
    speed: 2.2
    rest: 0.8
    travel: 0.20
    straightness: 0.6
    pressMs: 100
    raiseMs: 900
    contactMs: 250
    cooldownMs: 250
    # Contact mode (VR PhysicalMeleeMode = Contact): where the game keeps a weapon's hit shape (weapon-type table, its
    # attack id byte; the attack parameters, their shape index byte; the shape table; the record's u16 weapon type) and
    # the characters' hurt spheres (u8 count, shape and centre list pointers, the kind byte, enemies are kind 2), the hook
    # word that shows cave D is in, and the tuning: a touch strikes at or above speed (m/s at the weapon's far hit point),
    # an enemy struck is armed again once the tip is slower than rearm for rearmMs or the weapon has left it for leaveMs;
    # the strength is light at speed rising to 1 at firm (the game's own hit), strong from heavy (above 1 the game raises
    # the reaction class: a pipe staggers at once, a spear knocks down); lead (cm) asks a frame before the touch, holdMs waits
    # at most that long after the first touch while the tip still speeds up (the strength is the swing's); the
    # strike's attack object lives windowFrames game frames. Weapons by the game's weapon type (+0xCA8).
    contact:
      shape: { types: 0x6E5940, typeStride: 0x44, attackId: 0x06, params: 0x6E7C90, paramStride: 0x20, shapeIndex: 0x0E, shapes: 0x6EBFA0, weaponType: 0xCA8 }
      spheres: { count: 0x1E0, shapes: 0x1D8, centres: 0x1DC, kind: 0x02, enemyKind: 2, reaction: 0x140, zone: 0x13E }
      hook: { address: 0x5CDF64, on: 0x0C03F880 }
      speed: 1.8
      rearm: 0.9
      rearmMs: 100
      leaveMs: 150
      firm: 3.0
      heavy: 5.5
      light: 0.6
      strong: 1.5
      lead: 8
      cooldownMs: 120
      holdMs: 35
      windowFrames: 6
      weapons:
        - { type: 32, speed: 1.5, firm: 2.5, heavy: 4.5 }   # Kevin's knife: a short blade, a slower tip
        - { type: 33, speed: 1.5, firm: 2.5, heavy: 4.5 }   # butcher knife
        - { type: 41, heavy: 6.5 }                          # scrub brush: long, so its head moves fast
        - { type: 44, heavy: 6.5 }                          # spear
    # Hit jolt (VR MeleeHitJolt, a prototype, strictly offline; research/2026-10-14-vr-melee.md sections 8 and 9): when a
    # contact strike lands, the bones near the struck hurt sphere turn the way the swing went, then ease back. block / magic:
    # cave G's (4 entries of 24 bytes from +0x10); hook: the zombie's update word while cave G is in; bones: an enemy's
    # pointer to its model (+0x34), the model's table of bone pointers (+0x820, each to a 4 x 4 world matrix) and the bone
    # count (real: where the model keeps its own u16 count, a smaller model's table holds stale pointers past it; review d10). The turn: minDeg at slow (m/s at the weapon's far hit point) and below, maxDeg at fast and above, and back to
    # nothing over minFrames to maxFrames of the enemy's updates (30 a second; linear). chains: per struck sphere's bone,
    # the bones that turn, each bone's parent (the frame the turn is given in), its share, and (below) the bones that
    # move the body below their joint (the legs). File #1's zombie: head (sphere bone 21) -> neck 20,
    # chest 11, waist 10; belly (10) -> waist 10, chest 11; knees (3) -> the legs' root 3 and the waist 10. Each bone's
    # turn is about (joint -> contact) x swing, the lever's height mirrored to the side the bone moves, so the part it
    # moves goes with the swing (a belly hit below the waist tips the body back, it does not fold it toward you).
    # spring (present: a spring-damper instead of the linear decay; 2026-10-15): each struck bone gets an angular
    # velocity of impulse deg/s per m/s (speed capped at maxSpeed) x its weight about that turn, and each enemy update
    # integrates angle'' = -stiffness angle - damping angle' (1/s^2, 1/s; ratio 0.45: it overshoots once by about a fifth
    # and settles in ~0.5 s), clamped to maxDeg; loose bones (the arms) use looseStiffness / looseDamping / looseMaxDeg
    # and swing; hard bones move only from hard m/s. Hits add up. Ends when under settleDeg and settleRate deg/s, or
    # after maxFrames updates. The minDeg..maxFrames values above are then unused.
    jolt:
      block: 0xFF100
      magic: 0x4A4C5431
      hook: { address: 0x6644D0, on: 0x0C03FA40 }
      bones: { pointer: 0x34, table: 0x820, count: 36, real: 0x816 }
      slow: 1.8
      fast: 6.0
      minDeg: 8
      maxDeg: 24
      minFrames: 5
      maxFrames: 10
      spring: { stiffness: 200, damping: 12.7, looseStiffness: 120, looseDamping: 7, impulse: 120, maxSpeed: 8,
                maxDeg: 30, looseMaxDeg: 40, hard: 4.0, settleDeg: 0.75, settleRate: 15, maxFrames: 45 }
      chains:
        # head: neck, head, chest; a hard hit the waist too
        - { sphere: 21, bones: [20, 21, 11, 10], parents: [11, 20, 10, 2], weights: [1.0, 0.5, 0.35, 0.2], hard: [10] }
        # belly: waist, chest; a hard hit swings both arms (clavicles, loose: they lag, then swing back)
        - { sphere: 10, bones: [10, 11, 12, 16], parents: [2, 10, 11, 11], weights: [1.0, 0.5, 0.8, 0.8], loose: [12, 16], hard: [12, 16] }
        # knees: the legs' root (below), waist; a hard hit the chest too
        - { sphere: 3, bones: [3, 10, 11], parents: [2, 2, 10], weights: [0.6, 0.3, 0.2], below: [3], hard: [11] }

    # Fists (VR PhysicalMeleeFists, with contact, strictly offline; research/2026-10-14-vr-melee.md section 12): with bare
    # hands (no item equipped) or a gun, a fast swing of the right hand strikes through cave D and cave H: the host writes
    # magic at word and attack + 1 after it (the knife's attack, id 33: a sphere r 30 at (-10, 0, 0) in the object's frame,
    # base 55, zombie class 0), and the block's pose puts that sphere's centre on the fist (point, metres in the hand's
    # pointing frame: x right, y up, z back) or, with a gun, on the gun's butt (whip). The host's own test is a sphere of
    # radius (game units) there; a touch at speed (m/s) or faster strikes, with the strength light rising to 1 by firm,
    # times scale (0.2-0.4: 11-22 HP of the knife's 55, never above 1, so the class stays 0: a light flinch). wait: an
    # enemy's u8 that must read 0 for the game's hit test to take it (FUN_005ABA30; non-zero while down or grabbing), for
    # every contact strike.
    fist: { word: 0xFEBF0, magic: 0x46535431, attack: 33, wait: 0x32, point: [0.0, 0.0, -0.04], whip: [0.0, -0.07, 0.03],
            radius: 8, speed: 2.5, rearm: 1.0, firm: 6.0, light: 0.5, scale: 0.4 }
    # Gun ray (VR GunRayAim, strictly offline; research/2026-10-14-vr-melee.md section 11): cave I's block (magic, the
    # stamp, the local record, the shot count cave I keeps, the 4 x 4 matrix at +0x10, the origin at +0x50) and the game's
    # own back offset for a shot's origin: f32 at table + stride * the weapon type's class byte (types + typeStride * type +
    # class, contact.shape's table) + 4 * the record's character byte (+character); negative, along the barrel.
    gunRay: { block: 0xFEB80, magic: 0x47554E31, back: { table: 0x6E6D30, stride: 0x20, class: 0x05, character: 0xB98 } }
    # Gun object (VR GunObjectAim, on top of gunRay; section 13): cave O's block (magic GOB1, the stamp, the local record,
    # cave O's shot count, the flash stub's count and the flash's origin, the fake object's matrix at +0x40 and position at
    # +0x80; the fake object is the block + 0x40 - 0x1C0) and the model-space muzzle's offset in a weapon-type entry
    # (contact.shape's types table: 3 f32, the 45 Auto's (-9.5, 0, 5.1)).
    gunObject: { block: 0xFF500, magic: 0x474F4231, muzzle: 0x38 }
  # VR controllers (only when launched with --vr; flat play is untouched).
  # A pad bound in Settings -> Controllers (e.g. a DualSense) keeps working alongside;
  # when both touch the same button, the latest change wins.
  #
  # Layout from the reverse-engineered button map (outbreak-vr docs/game-internals.md,
  # Controller TYPE A, the default). Circle = OK/attack/fire, Cross = cancel/back
  # (hold + forward = run), Square = ad-lib, Triangle = map, Start = item screen,
  # R1 held = weapon ready with lock-on, L1 = reload / next target / tab.
  # Select (pause/options) stays off the controllers on purpose: online it doesn't pause.
  # Steam Frame: A, B, X, Y and Menu are on the right controller, the D-pad and View on the left.
  # Touch-style controllers: A/B right, X/Y and Menu left. Y (the top button) opens the map on both.
  # The right stick turns the view (camera.lookAt), so it is not passed to the game as a stick. A quick
  # flick of it straight up or down (RightStickUp/Down) presses the PS2 right stick's up/down, the
  # ad-lib shouts; a mostly vertical push doesn't turn the view.
  # Running: click the left stick while walking and you keep running (Cross held) until the stick
  # is centred, so the right thumb stays free to turn. The latch is ORed into ButtonB (params
  # sprintLatch), so a tap of B can't let it go; it lets go as the item screen, a menu, a cutscene
  # or the raised weapon takes over.
  #
  # The grips are for gestures only, so a squeeze at the hip can't also do something
  # else (Outbreak doesn't use L2). Zones are placed from the head (metres: side + right, height + up, forward +
  # ahead) and turn with the head's yaw. Squeeze the grip inside one to press its button;
  # it holds until the grip opens, wherever the hand goes.
  # To tune: copy this file into <data dir>/vrprofiles/ and edit the copy.
  # VR presence ([VR] VrPresence, off by default; tools/outbreak-vr/research/2026-10-21-vr-presence.md): in private co-op
  # each console sends the other its player's VR head and hands over a UDP side channel of our own, and draws the
  # partner's beside the partner's character. Reads only: room, the u16 room the local player is in (as melee.online);
  # in each camera.base record, recordRoom the u16 room that character is in (+0x1E2, the same value the game's own
  # messages carry) and recordUsed a u16 that is not zero in a used record (the max HP; record 3 reads 0 when nobody
  # plays it). The partner is the record whose +0x03 is the packet's slot; its position is camera.lookAt.position.
  presence: { room: 0x3065AC, recordRoom: 0x1E2, recordUsed: 0x546 }
  # VR body ([VR] VrBody, off by default; tools/outbreak-vr/research/2026-10-21-vr-body.md): the partner (and with
  # VrBodySelf your own arms) shown as the game's own character posed by the VR head and hands. Where the bones are
  # (*(record + 0x34) + 0x820 + 4 * bone, a 0x190-byte struct: world matrix +0x00, local +0x40, index s16 +0xC4, parent
  # +0xC8; the model's u16 count +0x816), the bones it poses (every File #1 player character: the chest 11, the neck 20
  # and head 21, per side clavicle, shoulder, elbow, wrist: the model's +X side 12-15 is the character's left, -X 16-19
  # its right, where the game puts the weapon), the eyes in the head bone's frame, and cave V's host block, matrix
  # tables (two of 0x600 from 0xFD400), the update site and the draw site (camera.silence, whenSetting VrBody). Free RAM: 0xFD000-0xFDFFF and
  # 0xFF300-0xFF3FF read zero in all 22 RAM dumps of File #1 we have.
  body: { block: 0xFF300, tables: 0xFD400, hook: 0x345314, hookOn: 0x0C03F400, chest: 11, neck: 20, head: 21, arms: [[12, 13, 14, 15], [16, 17, 18, 19]], eye: [0, 7, 9] }

  controls:
    - device: Gamepad
      id: controllers
      pad: 1
      params: { sprintLatch: ButtonB }
      bind:
        RightTriggerPress: Circle
        ButtonA: Circle
        ButtonB: Cross
        ButtonX: Square
        ButtonY: Triangle
        Menu: Start
        RightBumper: R1
        DpadUp: Up
        DpadDown: Down
        DpadLeft: Left
        DpadRight: Right
        LeftTriggerPress: L1
        RightStickClick: R3
        LeftStickX: LeftStickX
        LeftStickY: LeftStickY
        RightStickUp: RUp
        RightStickDown: RDown
    - device: Zone
      id: holster
      notes: "Right hip holster: squeeze the grip there to ready the weapon (R1, lock-on); keep squeezing to stay aimed."
      placement: { side: 0.22, height: -0.50, forward: 0.12 }   # seated thigh/hip; standing hip is -0.62 / 0.0
      params: { radius: 0.20, hand: right, grip: true }
      pad: 1
      bind:
        Pressed: R1
    - device: Zone
      id: belt
      notes: "Left hip: squeeze the left grip there to open the item screen (Start), shown in front of you; squeeze there again to close it."
      placement: { side: -0.22, height: -0.50, forward: 0.12 }   # mirror of the holster
      params: { radius: 0.20, hand: left, grip: true, stopFirst: true }   # the item screen only opens standing still: stop, then press
      pad: 1
      bind:
        Pressed: Start
    - device: Zone
      id: backpack
      notes: "Over the right shoulder: reach back past your ear and squeeze the grip to open the item screen (Start); with a long gun equipped (slung there) the squeeze raises it instead (R1, as at the holster)."
      placement: { side: 0.15, height: -0.05, forward: -0.08 }   # a chair back blocks reaching further
      params: { radius: 0.15, hand: right, grip: true, stopFirst: true }
      pad: 1
      bind:
        Pressed: Start
        PressedLongGun: R1   # a squeeze begun with a long gun equipped (feedback.weapon): R1 at once, held, no stop first
