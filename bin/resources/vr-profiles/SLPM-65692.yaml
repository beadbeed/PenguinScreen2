# SPDX-License-Identifier: GPL-3.0-or-later
# Outbreak VR profile (our own; not one of PenguinScreen2's CC BY-NC profiles).
#
# Measured on File #1 (J's Bar) with the ARMSX2 stereo testbed, 2026-10-07:
#  - Outbreak's screen Z is exactly affine in 1/w (per-frame fit R2 = 1.000000,
#    100% intercept agreement over 71 draws), so Z-driven depth is safe and
#    gives every draw a correct depth, including untextured ones.
#  - 1/w spans about 0.001 (far walls, w ~ 1000) to 0.018 (nearest props, w ~ 55).
#    Convergence 55 puts the nearest props at the screen plane and everything
#    else behind it.
#  - Separation 0.012 per eye keeps distant content within an IPD-sized offset on
#    a ~2 m wide virtual screen (no eye divergence).
# File #2 runs the same engine; its values are carried over until measured.

SLPM-65692:
  name: "Biohazard Outbreak File 2 (Japan, English patch)"
  crcs: [0x70C1FE97, 0xDC0BFB60, 0x6FCA6FBD, 0x70C0F696, 0x6FCB67BC]
  tier: stereo
  notes: "Fixed/rail cameras over real-time 3D rooms. First person: camera.lookAt puts the eye at the local character's head."
  # World-locked screen for menus, the item screen, the map, cutscenes and doors: placed straight in front
  # of the head each time first person hands over, 2.5 m out and 1.3 m tall (about 29 deg). While first
  # person drives the camera, the firstPerson screen is used instead: sized to the game camera's FOV
  # (camera.fov below, 100 deg vertical: height = 2 * distance * tan(50 deg)), flat so perspective holds,
  # and placed where the shown frame was rendered from (camera.lookAt viewMatrix; poseLagMs is the
  # fallback guess), so the runtime can reproject it as the head turns.
  screen: { distance: 2.5, height: 1.3, firstPerson: { distance: 1.5, height: 3.575, arc: 0, poseLagMs: 40 } }
  stereo:
    separation: 0.012
    convergence: 55.0
    zDrivenDepth: true
    # First-person screen (1.5 m away, 4.77 m wide): about orthostereo, so the screen plane sits at
    # 1.5 m (convergence = 150 game units at 100 units/m) and far content gets an IPD of separation
    # (0.063 m / 4.77 m). A starting point to tune in the headset.
    firstPerson: { separation: 0.0132, convergence: 150 }
  # First-person camera (only with --vr and the VR 'Head-Tracked Camera' setting, on by default).
  # Outbreak builds its view from an eye and a target vector. During normal room play (GAME overlay
  # resident, scenario in game, room camera in normal mode) the room camera's three cut handlers and the
  # door follow camera's eye writes are NOP'd, so nothing overwrites them; the view build after them still
  # runs. camera.lookAt then writes the eye at the local character's head every vsync, looking along the
  # character's heading (+0x92) plus head yaw, tilted by head pitch, moved by head translation (cm units).
  # File #2 code words checked against our 2.DAT; heading +0x92 is carried over from File #1 and not yet confirmed live.
  # Research notes: tools/outbreak-vr and D:/Games/PS2/research on the test PC.
  camera:
    base: { indexed: 0x47BD30, indexAddr: 0x4912BD, indexWidth: 1, stride: 0x1100 }   # local character record
    guards:
      - { address: 0x543004, equals: 3 }             # GAME overlay resident
      - { address: 0x4912A0, equals: 2, width: 1 }   # scenario status: in game
      - { address: 0x3B31F5, equals: 0, width: 1 }   # room camera in normal mode (not a scripted shot)
    # The camera update flips the mode byte to 3 and back inside a frame about 12 times a second;
    # only hand the camera back once the guards have failed for 0.1 s.
    disarmAfterVsyncs: 6
    silence:
      - { address: 0x595248, on: 0x00000000, off: 0x0C165504, when: [{ address: 0x543004, equals: 3 }] }   # fixed-cut handler
      - { address: 0x595258, on: 0x00000000, off: 0x0C165670, when: [{ address: 0x543004, equals: 3 }] }   # spline cut handler
      - { address: 0x595268, on: 0x00000000, off: 0x0C165548, when: [{ address: 0x543004, equals: 3 }] }   # rail cut handler
      - { address: 0x5AA818, on: 0x00000000, off: 0x0C0D0D3C, when: [{ address: 0x543004, equals: 3 }] }   # door follow camera eye write
      - { address: 0x5AA978, on: 0x00000000, off: 0x0C0D0D3C, when: [{ address: 0x543004, equals: 3 }] }   # door follow camera eye write
      - { address: 0x5AAAB4, on: 0x00000000, off: 0x0C0D0D3C, when: [{ address: 0x543004, equals: 3 }] }   # door follow camera eye write
      - { address: 0x6363B8, on: 0x00000000, off: 0xA2A20FBA, when: [{ address: 0x543004, equals: 3 }] }   # stick latch on camera-cut lines (would freeze gaze steering)
    lookAt:
      eye: 0x313548
      target: 0x313554
      position: 0x38      # f32 x, y (up), z
      heading: 0x92       # s16, 0x10000 = 360 deg, 0 faces +Z
      eyeHeight: 155
      eyeForward: 10      # about where the eyes are; the body is hidden (see hold) while your head stays within about
                          # 19 cm above / 50 cm around where you recentered: recenter if it ever shows
      distance: 100
      roll: 0x31359C         # camera roll (s32 holding a 16-bit angle): written level (rollSign 0) so a cut's
      rollSign: 0          # roll can't stay latched; the first-person screen itself stays roll-level
      unitsPerMeter: 100
      # Outbreak's yaw grows counter-clockwise like the headset's (checked: with the camera held at yaw W,
      # stick left walks toward W+90, right toward W-90), so yawSign stays 1.
      # Movement is camera-relative in the default control type: stick up walks where the camera
      # looks, i.e. where you look. So the camera keeps its own yaw (the way the character faces each
      # time first person takes over or you recenter), turned smoothly by the right controller stick
      # (120 deg/s at full push), or in 30 deg steps with the VR "Snap Turning" setting.
      yawAnchor: true
      smoothTurnDegPerSec: 120
      snapTurnDeg: 30
      snapStick: right
      # Weapon raised (stance 2, R1 or the hip holster): the character faces where the right
      # controller points. Aim pitch (+0xBC8, needs the servo silenced) is not enabled yet.
      # Walk and shoot: with the weapon up the left stick moves you at 70 cm/s (where you look, like
      # walking); the game itself would only turn and tilt the aim with it. Checked on File #1: walls
      # still stop you (the game's collision pushes the position back out).
      aim: { stance: 0x08, equals: 2, hand: right, move: 70, moveStick: left }
      # Checked live on File #2 (Training Ground): item screen flag, near-cull table, view matrix and the
      # stick magnitude (+0xFA8: the record is 0x20 longer than File #1's). No File #1-style action byte
      # was found, so body-follow uses stance + stick only.
      pauseWhen: [{ address: 0x4912BE, equals: 1, width: 1 }]
      bodyFollow:
        - { offset: 0x08, equals: 1, width: 1 }     # stance: normal (2 = weapon raised)
        - { offset: 0xFA8, equals: 0, width: 2 }    # stick magnitude: centred
      hold:
        - { address: 0x3B31F4, value: 3, width: 1, restoreFrom: 0x4912BD, when: [{ address: 0x4912BD, notEquals: 3, width: 1 }], notes: "camera focus slot" }
        - { address: 0x3B31F4, value: 0, width: 1, restoreFrom: 0x4912BD, when: [{ address: 0x4912BD, equals: 3, width: 1 }], notes: "camera focus slot (you are slot 3)" }
        - { address: 0x718DB4, f32: 75.0, restoreF32: 80.0, when: [{ address: 0x543004, equals: 3 }], notes: "near-cull radius, characters" }
      viewMatrix: 0x3134F0
      syncFramesBack: 2
    fov: { address: 0x313590, encoding: f32, scale: 100.0 }   # vertical FOV, degrees (about 115 horizontal at 4:3)
  # VR controllers (only when launched with --vr; flat play is untouched).
  # A pad bound in Settings -> Controllers (e.g. a DualSense) keeps working alongside;
  # when both touch the same button, the latest change wins.
  #
  # Layout from the reverse-engineered button map (outbreak-vr docs/game-internals.md,
  # Controller TYPE A, the default). Circle = OK/attack/fire, Cross = cancel/back
  # (hold + forward = run), Square = ad-lib, Triangle = map, Start = item screen,
  # R1 held = weapon ready with lock-on, L1 = reload / next target / tab.
  # Select (pause/options) stays off the controllers on purpose: online it doesn't pause.
  # Steam Frame: A, B, X, Y and Menu are on the right controller, the D-pad and View on the left.
  # Touch-style controllers: A/B right, X/Y and Menu left. Y (the top button) opens the map on both.
  # The right stick turns the view (camera.lookAt), so it is not passed to the game: the PS2 right
  # stick's up/down plays ad-lib shouts in Outbreak.
  #
  # The grips are for gestures only, so a squeeze at the hip can't also do something
  # else (Outbreak doesn't use L2). Zones are placed from the head (metres: side + right, height + up, forward +
  # ahead) and turn with the head's yaw. Squeeze the grip inside one to press its button;
  # it holds until the grip opens, wherever the hand goes.
  # To tune: copy this file into <data dir>/vrprofiles/ and edit the copy.
  controls:
    - device: Gamepad
      id: controllers
      pad: 1
      bind:
        RightTriggerPress: Circle
        ButtonA: Circle
        ButtonB: Cross
        ButtonX: Square
        ButtonY: Triangle
        Menu: Start
        RightBumper: R1
        DpadUp: Up
        DpadDown: Down
        DpadLeft: Left
        DpadRight: Right
        LeftTriggerPress: L1
        RightStickClick: R3
        LeftStickX: LeftStickX
        LeftStickY: LeftStickY
    - device: Zone
      id: holster
      notes: "Right hip holster: squeeze the grip there to ready the weapon (R1, lock-on); keep squeezing to stay aimed."
      placement: { side: 0.22, height: -0.50, forward: 0.12 }   # seated thigh/hip; standing hip is -0.62 / 0.0
      params: { radius: 0.20, hand: right, grip: true }
      pad: 1
      bind:
        Pressed: R1
    - device: Zone
      id: belt
      notes: "Left hip: squeeze the left grip there to open the item screen (Start), shown in front of you; squeeze there again to close it."
      placement: { side: -0.22, height: -0.50, forward: 0.12 }   # mirror of the holster
      params: { radius: 0.20, hand: left, grip: true }
      pad: 1
      bind:
        Pressed: Start
    - device: Zone
      id: backpack
      notes: "Over the right shoulder: reach back past your ear and squeeze the grip to open the item screen (Start)."
      placement: { side: 0.15, height: -0.05, forward: -0.08 }   # a chair back blocks reaching further
      params: { radius: 0.15, hand: right, grip: true }
      pad: 1
      bind:
        Pressed: Start
